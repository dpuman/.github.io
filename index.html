<title>Setu Exchange</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400..700&display=swap">
<style>
/* Layout concept: one page that reads as a bridge between two clocks.
   Blue is the Aabenraa side, green is the Birganj side, turmeric marks the shared window and play.
   Display: Bricolage Grotesque. Body: Atkinson Hyperlegible, chosen for legibility and because SMS runs an inclusion project. Times: DM Mono. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#E1E9EB; --ink:#0F2730; --muted:#46606A; --line:#C6D3D8;
  --dk:#2A5C8F; --dk-soft:#D6E4F2; --bd:#17693F; --bd-soft:#D2EBDD; --spark:#E0A21B; --spark-soft:#F8E7BC;
  --on-accent:#FFFFFF; --focus:#0F2730;
  --f-display:'Bricolage Grotesque','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Noto Sans Bengali',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A20; --surface:#12262E; --surface-2:#1A323B; --ink:#E8F0F2; --muted:#9FB4BB; --line:#274550;
    --dk:#86B8EA; --dk-soft:#1B3552; --bd:#62CB98; --bd-soft:#153B2B; --spark:#F2BE4E; --spark-soft:#4A3A12;
    --on-accent:#08141A; --focus:#E8F0F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A20; --surface:#12262E; --surface-2:#1A323B; --ink:#E8F0F2; --muted:#9FB4BB; --line:#274550;
  --dk:#86B8EA; --dk-soft:#1B3552; --bd:#62CB98; --bd-soft:#153B2B; --spark:#F2BE4E; --spark-soft:#4A3A12;
  --on-accent:#08141A; --focus:#E8F0F2; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.in{max-width:1120px;margin-inline:auto;width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

/* header */
.top{background:var(--bg);z-index:9}
@media (min-width:700px){.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.top .in{display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font:800 1.5rem/1 var(--f-display);letter-spacing:-.03em}
.brand small{font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.04em;display:block;margin-top:2px}
.links{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 300px;scrollbar-width:thin}
.links a{white-space:nowrap;text-decoration:none;font-weight:700;font-size:.92rem;padding:.45em .7em;border-radius:8px;color:var(--muted)}
.links a:hover{background:var(--surface-2);color:var(--ink)}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.3em .65em;font-weight:700;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px 48px;align-items:center;padding-block:44px 16px}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.dk{background:var(--dk)} .dot.bd{background:var(--bd)}
h1{font:750 clamp(2.3rem,6vw,4.1rem)/1.02 var(--f-display);letter-spacing:-.025em;margin:.3em 0 .4em;text-wrap:balance}
h1 span{display:block} h1 .a{color:var(--dk)} h1 .b{color:var(--bd)}
.hero .lede{font-size:1.12rem;max-width:52ch}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{font:700 1rem var(--f-body);padding:.7em 1.15em;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}

.bridge{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;min-width:0}
.bridge h3{margin:0;font:600 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.arc{width:100%;height:auto;display:block}
.arc text{font:500 22px var(--f-mono);fill:var(--ink)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clock{border-radius:12px;padding:12px 14px;min-width:0}
.clock.dk{background:var(--dk-soft)} .clock.bd{background:var(--bd-soft)}
.clock .place{font:700 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.clock.dk .place{color:var(--dk)} .clock.bd .place{color:var(--bd)}
.clock .time{font:500 clamp(1.8rem,5.5vw,2.7rem)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.clock .date{font-size:.85rem;color:var(--muted)}
.stripwrap{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px}
.labels{display:grid;gap:6px;grid-auto-rows:22px;font:700 .72rem/22px var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.labels .dk{color:var(--dk)} .labels .bd{color:var(--bd)}
.tracks{position:relative;display:grid;gap:6px}
.track{position:relative;height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;border-radius:6px}
.band.dk{background:var(--dk)} .band.bd{background:var(--bd)}
.ov{position:absolute;top:-4px;bottom:-4px;border:2px solid var(--spark);background:color-mix(in srgb,var(--spark) 28%,transparent);border-radius:8px;pointer-events:none}
.now{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink);border-radius:1px}
.axis{position:relative;height:36px;margin-top:6px;font:400 .68rem/1.3 var(--f-mono)}
.axis span{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
.axis span:first-child{transform:none;text-align:left}
.axis span:last-child{transform:translateX(-100%);text-align:right}
.axis i{display:block;font-style:normal}
.axis .b{color:var(--bd)} .axis .d{color:var(--dk)}
.shared{margin:0;font-size:.95rem;background:var(--spark-soft);border-radius:10px;padding:10px 12px}
.note{margin:0;font-size:.85rem;color:var(--muted)}

/* sections */
.sec{padding-block:60px 4px}
h2{font:700 clamp(1.7rem,4vw,2.5rem)/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 .4em;text-wrap:balance}
h3.sub{font:700 1.25rem/1.2 var(--f-display);margin:0 0 .3em}
.lede{color:var(--muted);max-width:64ch;margin:0 0 26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.chip{font:700 .85rem var(--f-body);padding:.4em .85em;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.03em;padding:.2em .55em;border-radius:6px;background:var(--surface-2);color:var(--ink)}

/* path */
.path{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:24px;align-items:start}
@media (max-width:820px){.path{grid-template-columns:minmax(0,1fr)}}
.steps{display:grid;gap:8px}
.step{--i:0;margin-inline-start:calc(var(--i)*12px);width:calc(100% - var(--i)*12px);display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:700;min-width:0}
.step[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 .85rem var(--f-mono);color:var(--on-accent);background:color-mix(in srgb,var(--bd) calc(var(--i)*16.67%),var(--dk))}
.here{margin-inline-start:auto;font:500 .7rem var(--f-mono);font-style:normal;background:var(--spark);color:#1B1405;padding:.15em .5em;border-radius:6px}
.detail{display:grid;gap:12px}
.detail h3{margin:0;font:750 1.8rem/1.1 var(--f-display);letter-spacing:-.02em}
.detail p{margin:0}
.detail ul,.week ul{margin:0;padding-left:1.1em;display:grid;gap:6px}

/* practicum */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.week{display:grid;gap:14px}
.week .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.week .cell{background:var(--surface-2);border-radius:12px;padding:14px;min-width:0}
.week .cell b{display:block;font:600 .74rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.week .think{background:var(--spark-soft)}
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:12px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;min-width:0}
.win .wk{font:600 .74rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.win .d{font:700 1.05rem var(--f-display)}
.win .t{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums}
.win .t.dk{color:var(--dk)} .win .t.bd{color:var(--bd)}

/* play */
.filters{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fgroup{display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard h4{margin:0;font:700 1.2rem/1.15 var(--f-display)}
.pcard p{margin:0;font-size:.95rem}
.pcard.pop{outline:3px solid var(--spark);outline-offset:3px}
.metas{display:flex;gap:6px;flex-wrap:wrap}
.bline{background:var(--spark-soft);border-radius:8px;padding:8px 10px;font-size:.9rem}
.bline b{font:600 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:block}
.needs{font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .74rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.snd{font:400 .85rem var(--f-mono);color:var(--muted)}

/* quiz */
.quiz{display:grid;gap:14px;max-width:760px}
.quiz .q{font:700 1.3rem/1.25 var(--f-display);margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--bd);background:var(--bd-soft)}
.opt.no{border-color:var(--ink);background:var(--surface-2);text-decoration:line-through}
.fb{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.prog{font:500 .78rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* library */
.lbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.lbar input{font:inherit;padding:.6em .9em;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 220px;max-width:380px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px 16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}}
.row h4{margin:0 0 3px;font:700 1.08rem/1.2 var(--f-display)}
.row p{margin:0 0 6px;font-size:.93rem;color:var(--muted)}
.pill{display:inline-block;font:600 .74rem var(--f-mono);padding:.25em .65em;border-radius:999px;border:1px solid var(--line)}
.pill.ready{background:var(--bd-soft);color:var(--bd);border-color:transparent}
.pill.planned{background:var(--spark-soft);border-color:transparent}
.rside{display:grid;gap:6px;justify-items:start}
.empty{padding:18px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}

/* voices */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.vcard{display:grid;gap:8px;align-content:start}
.vcard q{quotes:none;font:600 1.08rem/1.35 var(--f-display)}
.vcard .who{font-size:.85rem;color:var(--muted)}
.compose{margin-top:18px;display:grid;gap:10px;max-width:760px}
.compose label{font-weight:700}
.compose textarea,.compose select{font:inherit;padding:.6em .8em;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.compose textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400!important}
.check input{margin-top:.3em;width:18px;height:18px;flex:none}
.msg{min-height:1.4em;font-size:.9rem;color:var(--muted)}

/* rules */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.rule h4{margin:0 0 4px;font:700 1.12rem/1.2 var(--f-display)}
.rule p{margin:0;font-size:.95rem}
.rule .n{font:500 .74rem var(--f-mono);color:var(--muted);letter-spacing:.06em}

/* footer */
.foot{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:12px;font-size:.9rem;color:var(--muted)}
.foot p{margin:0;max-width:78ch}
.logos{display:flex;gap:10px;flex-wrap:wrap}
.logo{border:1.5px dashed var(--line);border-radius:8px;padding:10px 14px;font:400 .78rem var(--f-mono)}
details summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p{margin-top:8px}
</style>

<header class="top"><div class="in">
  <a class="brand" href="#top" aria-label="Setu Exchange">
    <svg width="38" height="24" viewBox="0 0 38 24" aria-hidden="true"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" style="stop-color:var(--dk)"/><stop offset="1" style="stop-color:var(--bd)"/></linearGradient></defs><path d="M3 20 Q19 -5 35 20" fill="none" stroke="url(#g1)" stroke-width="3.4" stroke-linecap="round"/><circle cx="3" cy="20" r="3" fill="var(--dk)"/><circle cx="35" cy="20" r="3" fill="var(--bd)"/></svg>
    <span><b>Setu</b><small data-t="brandSub"></small></span>
  </a>
  <nav class="links" aria-label="Sections">
    <a href="#path" data-t="nav_path"></a>
    <a href="#practicum" data-t="nav_practicum"></a>
    <a href="#play" data-t="nav_play"></a>
    <a href="#library" data-t="nav_library"></a>
    <a href="#voices" data-t="nav_voices"></a>
    <a href="#rules" data-t="nav_rules"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="da" aria-pressed="false">DA</button>
    <button type="button" data-lang="bn" aria-pressed="false">বাং</button>
  </div>
</div></header>

<main class="in" id="top">
  <section class="hero">
    <div>
      <div class="eyebrow"><span class="dot dk"></span><span class="dot bd"></span><span data-t="eyebrow"></span></div>
      <h1><span class="a" data-t="h1a"></span><span class="b" data-t="h1b"></span></h1>
      <p class="lede" data-t="lede"></p>
      <div class="ctas">
        <a class="btn" href="#path" data-t="cta1"></a>
        <a class="btn ghost" href="#play" data-t="cta2"></a>
      </div>
    </div>
    <div class="bridge" aria-live="off">
      <h3 data-t="b_title"></h3>
      <svg class="arc" viewBox="0 0 400 84" role="img" aria-label="Bridge between Aabenraa and Birganj">
        <defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" style="stop-color:var(--dk)"/><stop offset="1" style="stop-color:var(--bd)"/></linearGradient></defs>
        <path d="M20 72 C120 -12 280 -12 380 72" fill="none" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="20" cy="72" r="8" fill="var(--dk)"/><circle cx="380" cy="72" r="8" fill="var(--bd)"/>
        <text x="200" y="52" text-anchor="middle" id="diffTxt">+5 h</text>
      </svg>
      <div class="clocks">
        <div class="clock dk"><div class="place">Aabenraa</div><div class="time" id="tDK">--:--</div><div class="date" id="dDK"></div></div>
        <div class="clock bd"><div class="place">Birganj</div><div class="time" id="tBD">--:--</div><div class="date" id="dBD"></div></div>
      </div>
      <div class="stripwrap">
        <div class="labels"><span class="dk">Aabenraa</span><span class="bd">Birganj</span></div>
        <div>
          <div class="tracks" id="tracks"></div>
          <div class="axis" id="axis"></div>
        </div>
      </div>
      <p class="shared" id="shared"></p>
      <p class="note" data-t="weekNote"></p>
    </div>
  </section>

  <section class="sec" id="path">
    <h2 data-t="path_h"></h2>
    <p class="lede" data-t="path_l"></p>
    <div class="path">
      <div class="steps" id="steps"></div>
      <div class="card detail" id="detail" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec" id="practicum">
    <h2 data-t="practicum_h"></h2>
    <p class="lede" data-t="practicum_l"></p>
    <div class="tabs" id="wtabs" role="tablist"></div>
    <div class="card week" id="wpanel" role="tabpanel" aria-live="polite"></div>
    <h3 class="sub" style="margin-top:30px" data-t="windows_h"></h3>
    <p class="lede" style="margin-bottom:0" data-t="windows_l"></p>
    <div class="wins" id="wins"></div>
  </section>

  <section class="sec" id="play">
    <h2 data-t="play_h"></h2>
    <p class="lede" data-t="play_l"></p>
    <div class="filters">
      <div class="fgroup" id="fAge"></div>
      <div class="fgroup" id="fType"></div>
      <button class="btn ghost" type="button" id="surprise" data-t="surprise"></button>
    </div>
    <div class="cards" id="pcards"></div>

    <h3 class="sub" style="margin-top:40px" data-t="words_h"></h3>
    <p class="note" data-t="words_n"></p>
    <div class="tablewrap"><table id="words"></table></div>

    <h3 class="sub" style="margin-top:40px" data-t="quiz_h"></h3>
    <p class="lede" data-t="quiz_l"></p>
    <div class="card quiz" id="quiz"></div>
  </section>

  <section class="sec" id="library">
    <h2 data-t="lib_h"></h2>
    <p class="lede" data-t="lib_l"></p>
    <div class="lbar">
      <input type="search" id="lq" data-tp="lib_search" aria-label="Search">
      <div class="fgroup" id="lType"></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="sec" id="voices">
    <h2 data-t="voices_h"></h2>
    <p class="lede" data-t="voices_l"></p>
    <div class="vgrid" id="vgrid"></div>
    <form class="card compose" id="vform" novalidate>
      <label for="vtext" data-t="v_label"></label>
      <textarea id="vtext" maxlength="400"></textarea>
      <label for="vrole" data-t="v_role"></label>
      <select id="vrole"></select>
      <label class="check" for="vok"><input type="checkbox" id="vok"><span data-t="v_consent"></span></label>
      <div><button class="btn" type="submit" data-t="v_btn"></button></div>
      <div class="msg" id="vmsg" aria-live="polite"></div>

/* ---------- time bridge ---------- */
function offMin(tz,d){
  try{
    const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
    const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);
    return Math.round((asUTC-Math.floor(d.getTime()/1000)*1000)/60000);
  }catch(e){return tz===CFG.sms.tz?360:60;}
}
const diffH=d=>(offMin(CFG.sms.tz,d)-offMin(CFG.sosu.tz,d))/60;
function overlap(d){const df=diffH(d);const a=Math.max(CFG.sms.start,CFG.sosu.start+df),b=Math.min(CFG.sms.end,CFG.sosu.end+df);return b>a?{s:a,e:b,df}:null;}
function hh(x){const m=Math.round(x*60);return String(((Math.floor(m/60)%24)+24)%24).padStart(2,'0')+':'+String(((m%60)+60)%60).padStart(2,'0');}
const range=(a,b)=>hh(a)+' '+T('to')+' '+hh(b);
function fmtT(tz,d){try{return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);}catch(e){return '--:--';}}
function fmtD(tz,d,opt){try{return new Intl.DateTimeFormat(LOC[lang],Object.assign({timeZone:tz},opt)).format(d);}catch(e){return '';}}

function renderBridge(){
  const now=new Date();
  $('#tDK').textContent=fmtT(CFG.sosu.tz,now);$('#tBD').textContent=fmtT(CFG.sms.tz,now);
  $('#dDK').textContent=fmtD(CFG.sosu.tz,now,{weekday:'long',day:'numeric',month:'long'});
  $('#dBD').textContent=fmtD(CFG.sms.tz,now,{weekday:'long',day:'numeric',month:'long'});
  const df=diffH(now);
  $('#diffTxt').textContent='+'+(Number.isInteger(df)?df:df.toFixed(1))+' h';
  $('#diffTxt').setAttribute('aria-label',fill(T('ahead'),{n:df}));
  const clamp=x=>Math.max(0,Math.min(24,x));
  const pct=x=>(clamp(x)/24*100).toFixed(2);
  const sd=clamp(CFG.sosu.start+df),ed=clamp(CFG.sosu.end+df);
  const ov=overlap(now);
  const bdNow=(()=>{const [h,m]=fmtT(CFG.sms.tz,now).split(':').map(Number);return h+m/60;})();
  $('#tracks').innerHTML=
    `<div class="track"><i class="band dk" style="left:${pct(sd)}%;width:${(pct(ed)-pct(sd)).toFixed(2)}%"></i></div>`+
    `<div class="track"><i class="band bd" style="left:${pct(CFG.sms.start)}%;width:${(pct(CFG.sms.end)-pct(CFG.sms.start)).toFixed(2)}%"></i></div>`+
    (ov?`<i class="ov" style="left:${pct(ov.s)}%;width:${(pct(ov.e)-pct(ov.s)).toFixed(2)}%"></i>`:'')+
    `<i class="now" style="left:${pct(bdNow)}%"></i>`;
  let ax='';[0,6,12,18,24].forEach(h=>{ax+=`<span style="left:${pct(h)}%"><i class="b">${hh(h)}</i><i class="d">${hh(h-df)}</i></span>`;});
  $('#axis').innerHTML=ax;
  $('#shared').textContent=ov?fill(T('shared'),{a:range(ov.s-ov.df,ov.e-ov.df),b:range(ov.s,ov.e)}):T('noshared');
}

function renderWins(){
  const t=new Date();t.setHours(12,0,0,0);
  const add=((8-t.getDay())%7)||7;t.setDate(t.getDate()+add+1); /* Tuesday of next week */
  let h='';
  for(let i=0;i<4;i++){
    const d=new Date(t);d.setDate(d.getDate()+i*7);
    const ov=overlap(d);
    let body='';
    if(ov){const dur=Math.min(CFG.sessionMinutes/60,ov.e-ov.s);
      body=`<div class="t dk">Aabenraa ${range(ov.s-ov.df,ov.s-ov.df+dur)}</div><div class="t bd">Birganj ${range(ov.s,ov.s+dur)}</div>`;}

}

  const Q=questions(),box=$('#quiz');
  if(qi>=Q.length){
    box.innerHTML=`<div class="prog">${esc(T('quiz_h'))}</div><p class="q">${esc(fill(T('score'),{s:qs,n:Q.length}))}</p><div class="fb">${esc(T('reflect'))}</div><div><button type="button" class="btn" id="qagain">${esc(T('again'))}</button></div>`;
    return;
  }
  const q=Q[qi];const opts=q.o[lang]||q.o.en;
  box.innerHTML=`<div class="prog">${esc(fill(T('qOf'),{i:qi+1,n:Q.length}))}</div><p class="q">${esc(L(q.q))}</p><div class="opts">${opts.map((t,i)=>{let c='opt';if(qa!==null){if(i===q.a)c+=' ok';else if(i===qa)c+=' no';}return `<button type="button" class="${c}" data-i="${i}"${qa!==null?' disabled':''}>${esc(t)}</button>`;}).join('')}</div>${qa!==null?`<div class="fb" aria-live="polite"><b>${esc(qa===q.a?T('right'):T('wrong'))}</b> ${esc(L(q.x))}</div><div><button type="button" class="btn" id="qnext">${esc(qi===Q.length-1?T('finish'):T('next'))}</button></div>`:''}`;
}
$('#quiz').addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o&&qa===null){qa=+o.dataset.i;if(qa===questions()[qi].a)qs++;renderQuiz();return;}
  if(e.target.id==='qnext'){qi++;qa=null;renderQuiz();}
  if(e.target.id==='qagain'){qi=0;qs=0;qa=null;renderQuiz();}
});

/* ---------- library ---------- */
let lq='',lt='all';
const LT=['all','video','audio','read','sheet','link'];
function renderLib(){
  $('#lType').innerHTML=LT.map(t=>`<button type="button" class="chip" data-lt="${t}" aria-pressed="${t===lt}">${esc(t==='all'?T('tAll'):T('t'+t))}</button>`).join('');
  const q=lq.trim().toLowerCase();
  const list=LIB.filter(i=>(lt==='all'||i.ty===lt)&&(!q||(i.t.en+' '+i.t.da+' '+i.n.en+' '+i.n.da+' '+i.by).toLowerCase().includes(q)));
  const sk={ready:'sready',planned:'splanned',record:'srecord'};
  $('#rows').innerHTML=list.length?list.map(i=>`<article class="row"><span class="tag" style="justify-self:start">${esc(T('t'+i.ty))}</span><div style="min-width:0"><h4>${esc(L(i.t))}</h4><p>${esc(L(i.n))}</p><div class="metas"><span class="tag">${esc(i.by)}</span>${i.lg.map(l=>`<span class="tag">${esc(l)}</span>`).join('')}</div></div><div class="rside"><span class="pill ${i.st}">${esc(T(sk[i.st]))}</span>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(T('open'))}</a>`:`<span class="note">${esc(T('noLink'))}</span>`}</div></article>`).join(''):`<div class="empty">${esc(T('emptyLib'))}</div>`;
}
$('#lType').addEventListener('click',e=>{const b=e.target.closest('[data-lt]');if(b){lt=b.dataset.lt;renderLib();}});
$('#lq').addEventListener('input',e=>{lq=e.target.value;renderLib();});

/* ---------- voices ---------- */
let mine_posts=[];
function renderVoices(){
  const card=(who,tx,badge)=>`<article class="card vcard"><span class="tag" style="justify-self:start">${esc(badge)}</span><q>${esc(tx)}</q><span class="who">${esc(who)}</span></article>`;
  $('#vgrid').innerHTML=mine_posts.map(p=>card(p.who,p.tx,T('preview'))).join('')+VOICES.map(v=>card(L(v.who),L(v.tx),T('example'))).join('');
  const sel=$('#vrole'),cur=sel.value;
  sel.innerHTML=['r_student','r_teacher','r_other'].map(k=>`<option value="${k}">${esc(T(k))}</option>`).join('');
  if(cur)sel.value=cur;
}
$('#vform').addEventListener('submit',e=>{
  e.preventDefault();
  const tx=$('#vtext').value.trim(),msg=$('#vmsg');
  if(!tx){msg.textContent=T('v_need');return;}
  if(!$('#vok').checked){msg.textContent=T('v_need2');return;}
  mine_posts.unshift({who:T($('#vrole').value),tx});
  $('#vtext').value='';msg.textContent=T('v_done');renderVoices();
});

/* ---------- rules ---------- */
function renderRules(){
  $('#rgrid').innerHTML=RULES.map((r,i)=>`<article class="card rule"><span class="n">${i+1} / ${RULES.length}</span><h4>${esc(L(r.t))}</h4><p>${esc(L(r.b))}</p></article>`).join('');
}

/* ---------- language ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  $$('[data-t]').forEach(el=>{el.textContent=T(el.dataset.t);});
  $$('[data-tp]').forEach(el=>{el.placeholder=T(el.dataset.tp);});
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}
function renderAll(){applyStatic();renderBridge();renderPath();renderWeeks();renderWins();renderPlay();renderWords();renderQuiz();renderLib();renderVoices();renderRules();}
$('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('setu-lang',lang);}catch(x){}renderAll();});
renderAll();
setInterval(renderBridge,20000);
})();
</script>
